site_name: eopf-geozarr — GeoZarr driver for EOPF CPM
site_description: >-
  eopf-geozarr is the GeoZarr driver for ESA's EOPF CPM. Convert Sentinel-1,
  Sentinel-2 and Sentinel-3 products to cloud-optimized GeoZarr (Zarr v3) with
  multiscale pyramids and native projections, from CPM or as a standalone
  converter.
site_author: EOPF Explorer
site_url: https://eopf-explorer.github.io/data-model/
repo_url: https://github.com/EOPF-Explorer/data-model
repo_name: EOPF-Explorer/data-model
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-eopf-sentinel-explorer-dark-icon.png
  favicon: assets/logo-eopf-sentinel-explorer-dark-icon.png
  features:
    - navigation.sections
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.share

  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - social:
      cards_layout_options:
        background_color: "#0b3d63"

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/EOPF-Explorer/data-model
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/eopf-geozarr/

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - codehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - CPM driver: cpm-driver.md
  - Standalone converter: converter.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - API reference: api-reference.md
  - Examples: examples.md
  - Architecture: architecture.md
  - GeoZarr mini spec: geozarr-minispec.md
  - GeoZarr specification: geozarr-specification-contribution.md
  - FAQ: faq.md
