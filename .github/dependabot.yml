version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "developmentseed/data-model-developers"
    assignees:
      - "developmentseed/data-model-developers"
    commit-message:
      prefix: "deps"
      include: "scope"
    cooldown:
      default-days: 7
    ignore:
      # Coarsen reductions reject skipna= (pydata/xarray#11686).
      - dependency-name: "xarray"
        versions: ["2026.9.0"]
    groups:
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      # Whatever the group above leaves out: major bumps and requirement
      # widenings such as the zarr upper bound.
      uv-major:
        patterns:
          - "*"
      # Groups apply to version updates only unless told otherwise.
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "developmentseed/data-model-developers"
    assignees:
      - "developmentseed/data-model-developers"
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
          - "major"
        patterns:
          - "*"
