name: CI

on:
  push:
    branches: [ main, cpm-geozarr ]
  pull_request:
    branches: [ main, cpm-geozarr ]
  schedule:
    # Weekly run; also triggers the eopf-latest drift check below.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        # The pyright pre-commit hook runs `uv run --frozen pyright`, so the
        # project environment must be present.
        run: uv sync --group dev --group test
      - uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d # v2.0.4

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Restore global uv cache
      id: cache-restore
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv
          .venv
        key: uv-main-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-main-

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        version: "0.8.4"
        python-version: "3.13"
        enable-cache: false

    - name: Install dependencies
      run: uv sync --group dev --group test

    - name: Run tests
      run: |
        uv run pytest tests/ -v --tb=short -m "not network" --cov=eopf_geozarr --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Save uv caches
      if: steps.cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv
          .venv
        key: uv-main-${{ hashFiles('uv.lock') }}

  test-cpm:
    # Integration tests against eopf-cpm (the `cpm` extra; eopf requires
    # Python >= 3.13). The eopf version is pinned by uv.lock, so PR runs are
    # deterministic; upstream drift is caught by test-cpm-latest below.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        version: "0.8.4"
        python-version: "3.13"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra cpm --group test

    - name: Run CPM integration tests
      run: uv run pytest tests/test_cpm_writer.py tests/test_cpm_routing.py -v --tb=short

  test-cpm-latest:
    # Weekly drift check against the newest published eopf release: the
    # writer plugin depends on CPM internals (writer registry, staging, CLI
    # entry-point loading), so a new eopf release can break the contract
    # without any change on our side.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        version: "0.8.4"
        python-version: "3.13"
        enable-cache: true

    - name: Run CPM integration tests against latest eopf
      run: >
        uv run --extra cpm --group test --upgrade-package eopf
        pytest tests/test_cpm_writer.py tests/test_cpm_routing.py -v --tb=short
