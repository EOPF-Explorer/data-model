name: Security Audit

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # action-python-security-auditing posts and updates PR comments
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: developmentseed/action-python-security-auditing@f9770318e0566e83a2f45e5d7adb1f7c5ae56d2b # v1.1.0
      with:
        package_manager: uv
        comment_on: blocking
        bandit_scan_dirs: 'src/eopf_geozarr/'
        artifact_name: security-reports
